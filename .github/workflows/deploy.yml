# Deploy production on every push to main.
# Uses Vercel CLI + a personal token because the Vercel account cannot access
# the private is463-g1t7 org repo (native Git integration would need the
# Vercel GitHub App installed for that org).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Deploy to Vercel (production)
        run: bunx vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
